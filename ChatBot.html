<html>
<head>
    <title>Chat Bot</title>
    <link rel="stylesheet" href="ChatBot.css" />
    <link rel="stylesheet" href="Login.css" />
</head>
<body>
    <div class="js-container"> </div>
    <script src="react-basics.js"> </script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js">  </script>
    <script src="https://unpkg.com/supersimpledev/babel.js">   </script>
    <script src="ChatBot.js"></script>
    <script type="text/babel" src="LoginComponent.js"></script>
    <script type="text/babel">
    const THINK_DELAY = 1200;

    function ChatInput({chatMessages,setChatMessages}){
        const [inputText, setInputText] = React.useState('');
        function saveInputText(event){
            setInputText(event.target.value);
        }
        function handleKeyDown(event){
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
            if (event.key === 'Escape') {
                setInputText('');
            }
        }
        function sendMessage(){
            const trimmedText = inputText.trim();
            if (!trimmedText) return;
            const userMessage = {
                message: trimmedText,
                sender: 'user',
                id: crypto.randomUUID()
            };
            const thinkingMessage = {
                message: '',
                sender: 'robot',
                id: crypto.randomUUID(),
                isThinking: true
            };

            setChatMessages([
                ...chatMessages,
                userMessage,
                thinkingMessage
            ]);
            setInputText('');

            // after delay, replace thinking indicator with real response
            setTimeout(() => {
                const response = ChatBot.getResponse(trimmedText);
                setChatMessages(prevMessages => prevMessages.map(msg =>
                    msg.id === thinkingMessage.id
                        ? { ...msg, message: response, isThinking: false }
                        : msg
                ));
            }, THINK_DELAY);
        }
        return(
        <div className="chat-input-row">
            <input 
                placeholder="Send Message to ChatBot" 
                onChange={saveInputText}
                onKeyDown={handleKeyDown}
                value={inputText}
            />
            <button onClick={sendMessage} >Send</button>    
        </div>
        );
    }

    function ChatMessage({message,sender,isThinking}){
        const robotAvatar = 'https://img.icons8.com/fluency/48/000000/robot-2.png';
        const userAvatar = 'https://img.icons8.com/fluency/48/000000/user-male-circle.png';
        return(
            <div className={`chat-message ${sender}`}>
                {sender==='robot' && (
                    <img src={robotAvatar} alt="robot" />
                )}
                <div className={`message-bubble ${sender}`}>
                    {isThinking ? (
                        <div className="spinner" aria-hidden="true"></div>
                    ) : (
                        message
                    )}
                </div>
                {sender==='user' && (
                    <img src={userAvatar} alt="user" />
                )}
            </div>
        );
    }
    function ChatMessages({chatMessages}){
        const endRef = React.useRef(null);

        React.useEffect(() => {
            if (endRef.current) {
                endRef.current.scrollIntoView({ behavior: 'smooth' });
            }
        }, [chatMessages]);

        return (
            <div className="chat-messages">
                {chatMessages.map((chatMessage)=>{
                    return(
                        <ChatMessage
                            message={chatMessage.message}
                            sender={chatMessage.sender}
                            isThinking={chatMessage.isThinking}
                            key={chatMessage.id}
                        />
                    );
                })}
                <div ref={endRef} />
            </div>
        );
    }

    /* LoginPage is now provided by LoginComponent.js */

    function ChatApp(){
        const [chatMessages, setChatMessages] = React.useState([]);
        const [position, setPosition] = React.useState('bottom'); // 'top' | 'bottom'

        return (
            <div className={`chat-shell position-${position}`}>
                <div className="position-controls">
                    <a href="#" onClick={(e) => { e.preventDefault(); setPosition(pos => pos === 'bottom' ? 'top' : 'bottom'); }}>
                        {position === 'bottom' ? 'Move input to Top' : 'Move input to Bottom'}
                    </a>
                </div>
                <div className="chat-area">
                    {position === 'top' && (
                        <ChatInput
                            chatMessages={chatMessages}
                            setChatMessages={setChatMessages}
                        />
                    )}

                    <ChatMessages
                        chatMessages={chatMessages}
                    />

                    {position === 'bottom' && (
                        <ChatInput
                            chatMessages={chatMessages}
                            setChatMessages={setChatMessages}
                        />
                    )}
                </div>
            </div>
        );
    }

    function App(){
        const [isLoggedIn, setIsLoggedIn] = React.useState(false);
        const [username, setUsername] = React.useState('');

        function handleLogin(user){
            setUsername(user);
            setIsLoggedIn(true);
        }

        return isLoggedIn ? <ChatApp /> : <LoginPage onLogin={handleLogin} />;
    }

    const container =document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App/>)
</script>
</body>
</html>
